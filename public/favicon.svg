<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Checkerboard Pattern at Bottom Right Corner (symbolizing cutout transparency) -->
  <g opacity="0.12">
    <rect x="256" y="256" width="32" height="32" fill="#ffffff"/>
    <rect x="320" y="256" width="32" height="32" fill="#ffffff"/>
    <rect x="384" y="256" width="32" height="32" fill="#ffffff"/>
    <rect x="288" y="288" width="32" height="32" fill="#ffffff"/>
    <rect x="352" y="288" width="32" height="32" fill="#ffffff"/>
    <rect x="416" y="288" width="32" height="32" fill="#ffffff"/>
    <rect x="256" y="320" width="32" height="32" fill="#ffffff"/>
    <rect x="320" y="320" width="32" height="32" fill="#ffffff"/>
    <rect x="384" y="320" width="32" height="32" fill="#ffffff"/>
    <rect x="288" y="352" width="32" height="32" fill="#ffffff"/>
    <rect x="352" y="352" width="32" height="32" fill="#ffffff"/>
    <rect x="416" y="352" width="32" height="32" fill="#ffffff"/>
  </g>

  <!-- Subject Silhouette (Person Cutout) -->
  <g fill="none" stroke="url(#sparkleGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="216" cy="188" r="56" fill="#27272a"/>
    <!-- Shoulders / Torso -->
    <path d="M112 376c0-62 46-112 104-112s104 50 104 112" fill="#27272a"/>
  </g>

  <!-- Large Sparkle (AI Magic) -->
  <path d="M376 104c0 35.3 28.7 64 64 64-35.3 0-64 28.7-64 64 0-35.3-28.7-64-64-64 35.3 0 64-28.7 64-64z" fill="#ffffff"/>
  
  <!-- Small Sparkle -->
  <path d="M432 248c0 17.6 14.4 32 32 32-17.6 0-32 14.4-32 32 0-17.6-14.4-32-32-32 17.6 0 32-14.4 32-32z" fill="#e4e4e7"/>
  
  <!-- Mini Accent Sparkle -->
  <path d="M120 128c0 13.2 10.8 24 24 24-13.2 0-24 10.8-24 24 0-13.2-10.8-24-24-24 13.2 0 24-10.8 24-24z" fill="#a1a1aa"/>
</svg>
