name = "personal-bg-remover-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "*"
# Untuk produksi: set PERSONAL_SECRET_KEY dengan `npx wrangler secret put PERSONAL_SECRET_KEY`

[[d1_databases]]
binding = "DB"
database_name = "bg_remover_db"
database_id = "local-bg-remover-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bg-remover-storage"
